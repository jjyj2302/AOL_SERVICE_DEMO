services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - aol-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - aol-network
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aol}
      - POSTGRES_USER=${POSTGRES_USER:-aol}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aol_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    networks:
      - aol-network
    build:
      context: ./backend
      dockerfile: Dockerfile
      # BuildKit 최적화 옵션
      cache_from:
        - aol_service_demo_backend:latest
    image: aol_service_demo_backend:latest
    container_name: backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-aol}:${POSTGRES_PASSWORD:-aol_dev_password}@postgres:5432/${POSTGRES_DB:-aol}
      # Anthropic key for /chat/dialogue 자유 대화 — shell env 에서 pass-through
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/data:/backend/data
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  frontend:
    networks:
        - aol-network
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # BuildKit 최적화 옵션
      cache_from:
        - aol_service_demo_frontend:latest
    image: aol_service_demo_frontend:latest
    container_name: frontend
    ports:
      - "4000:80"
    restart: unless-stopped

networks:
  aol-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

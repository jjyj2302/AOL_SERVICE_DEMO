name: CI - Test and Build

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  # ===================================================================
  # 1. 백엔드 Python 정합성 — 빠른 fail-fast 검증
  # ===================================================================
  backend-lint:
    name: Backend · py_compile + LangGraph 모듈 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all backend Python files (syntax check)
        working-directory: backend
        run: |
          python -m compileall -q app main.py

      - name: Smoke test LangGraph Threat Hunter (시뮬레이션 모드, API 키 불필요)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/test.db
        run: |
          mkdir -p data
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from app.features.langgraph_threat_hunter.graph import build_graph
          from app.features.langgraph_threat_hunter.state import ThreatHuntState
          from app.features.langgraph_threat_hunter.simulations import list_scenarios, get_scenario

          scenarios = list_scenarios()
          assert len(scenarios) == 5, f"expected 5 scenarios, got {len(scenarios)}"

          graph = build_graph(mode='simulation')
          for sid in ['S1', 'S2', 'S3', 'S4', 'S5']:
              seed = get_scenario(sid)
              init = ThreatHuntState(
                  ioc=seed['ioc'],
                  ioc_type=seed['ioc_type'],
                  mode='simulation',
                  scenario_id=sid,
              )
              result = graph.invoke(init)
              final = result if isinstance(result, ThreatHuntState) else ThreatHuntState.model_validate(result)
              assert final.confidence_score >= 0.0, f"{sid} no confidence"
              assert final.automation_level is not None, f"{sid} no automation level"
              assert len(final.audit_ledger) == 5, f"{sid} ledger has {len(final.audit_ledger)} entries"
              print(f"  {sid} ✅ confidence={final.confidence_score} level={final.automation_level}")

          print("\nAll 5 scenarios passed.")
          PY

  # ===================================================================
  # 2. 프론트엔드 빌드 검증
  # ===================================================================
  frontend-build:
    name: Frontend · npm ci + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false   # CRA 가 경고를 에러로 처리하지 않도록
        run: npm run build

  # ===================================================================
  # 3. docker-compose 정합성 검증 (base + prod 오버레이)
  # ===================================================================
  compose-validate:
    name: Compose · base + prod 정합성
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yaml (base)
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Validate docker-compose.yaml + docker-compose.prod.yaml
        run: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml config --quiet

  # ===================================================================
  # 4. Docker 이미지 빌드 (최종 게이트)
  # ===================================================================
  docker-build:
    name: Docker · backend + frontend 이미지 빌드
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build, compose-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: aol-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: aol-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
